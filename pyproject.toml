[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "subauth"
version = "0.1.0.dev0"
description = "A developer-sponsored subscription runtime for AI services"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "p178" }]
dependencies = []

[project.scripts]
subauth = "subauth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subauth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

