name: Publish GitHub package

on:
  push:
    tags:
      - "v*-internal.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Java and GitHub Packages authentication
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Validate tag and set Maven version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-internal\.[0-9]+$ ]]; then
            echo "Expected a tag such as v0.2.0-internal.1, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$version" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Verify reactor
        run: mvn --batch-mode --no-transfer-progress clean install

      - name: Verify consumer POM packaging
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/verify-consumer-poms.sh "$version"

      - name: Verify Spring AI 1.1 compatibility
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gradle --no-daemon \
            -p compatibility-tests/spring-ai-1.1 \
            -PsubauthVersion="$version" \
            test

      - name: Publish reactor
        run: mvn --batch-mode --no-transfer-progress deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
