name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Verify current baseline
        run: mvn --batch-mode --no-transfer-progress clean install

      - name: Verify Spring AI 1.1 compatibility
        run: gradle --no-daemon -p compatibility-tests/spring-ai-1.1 test
